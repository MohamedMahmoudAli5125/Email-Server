<div class="mail-container">

    <form #emailForm="ngForm" class="main">
        <div class="upper-section">
            <input ngModel class="receiver-input compose-input" type="text" placeholder="To" name="to">
            <input ngModel class="subject-input compose-input" type="text" placeholder="Subject" name="subject">
        </div>
        <div class="lower-section">
            <textarea ngModel class="body-input" name="body" id="" placeholder="Body"></textarea>
            <input class="file-input" name="files" (change)="onFileSelected($event)" type="file" multiple>
            <div class="button-container">
                <select ngModel name="priority" id="priority">
                    <option *ngFor="let p of priorities" [value]="p.toUpperCase()">{{p}}</option>
                </select>
                <button class="draft" (click)="draftEmail(emailForm)">draft</button>
                <button type="submit" (click)="sendEmail(emailForm)" class="send">Send</button>
            </div>
        </div>
    </form>

</div>
