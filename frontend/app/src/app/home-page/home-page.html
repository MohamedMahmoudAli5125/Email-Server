
<div class="layout">
  <app-sidebar  
  (folderSelected)="onFolderChange($event)"
  (toggleComposeSignal)="toggleCompose()"
  (folderTypeSignal)="setFolderType($event)"
  ></app-sidebar>
  <app-email-list (openCompose)="openDraftEmail($event)" [folderType]="folderType" [folderId]="currentFolderId"
  (emailOpened)="onEmailOpened($event)"></app-email-list>
  <app-compose-box [isDraft]="isDraft" (closeCompose)="toggleCompose()" [currentEmail]="currentDraftEmail" style="z-index: 200;" [showCompose]="showCompose"></app-compose-box>

</div>
